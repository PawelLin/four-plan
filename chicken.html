<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三拼组合 · 可重复 · 8 种食材</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 32px 20px 70px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at 15% 0%, #fff6ea 0%, #faf6f0 45%, #f4efe7 100%);
    color: #3a3229;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  header h1 {
    margin: 0 0 8px;
    font-size: 27px;
    letter-spacing: 2px;
    font-weight: 700;
  }
  header h1 span { color: #c8553d; }
  .sub {
    margin: 0;
    font-size: 14px;
    color: #9a8b78;
    letter-spacing: .5px;
    line-height: 1.7;
  }
  .sub b { color: #c8553d; font-weight: 600; }

  /* ===== 工具栏 ===== */
  .toolbar {
    position: sticky;
    top: 12px;
    z-index: 20;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin: 22px 0 18px;
    padding: 12px 16px;
    background: rgba(255, 255, 255, .82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid #eee2d3;
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(120, 90, 60, .07);
  }
  .count {
    font-size: 14px;
    color: #7d6f5e;
    margin-right: auto;
  }
  .count b {
    color: #c8553d;
    font-size: 17px;
    font-variant-numeric: tabular-nums;
    padding: 0 2px;
  }
  .btn {
    appearance: none;
    border: 1.5px solid #e2d3bd;
    background: #fff;
    color: #6b5d4c;
    font-size: 13.5px;
    font-family: inherit;
    padding: 7px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .16s ease;
  }
  .btn:hover {
    border-color: #c8553d;
    color: #c8553d;
    background: #fdf3ef;
  }
  .btn:active { transform: scale(.96); }

  /* ===== 组合网格 ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 12px;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 12px 14px;
    background: #fff;
    border: 1.5px solid #ece1d1;
    border-radius: 12px;
    cursor: pointer;
    user-select: none;
    transition: border-color .16s, background .16s, box-shadow .16s, transform .16s;
  }
  .card:hover {
    border-color: #e0c9ac;
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(120, 90, 60, .09);
  }
  .card.on {
    border-color: #c8553d;
    background: #fdf3ef;
  }

  /* 自定义复选框 */
  .card input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    margin: 0;
    border: 2px solid #d8c9b4;
    border-radius: 5px;
    background: #fff;
    position: relative;
    cursor: pointer;
    transition: background .16s, border-color .16s;
  }
  .card input[type="checkbox"]:checked {
    background: #c8553d;
    border-color: #c8553d;
  }
  .card input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 4.5px;
    top: 1px;
    width: 4px;
    height: 8.5px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .num {
    flex: 0 0 auto;
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    color: #bcae9b;
    letter-spacing: .5px;
  }
  .card.on .num { color: #d79a8b; }

  .names {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    font-size: 14.5px;
    line-height: 1.45;
  }
  .names .ing { font-weight: 500; }
  .card.on .names .ing { color: #a8412c; }
  .names .plus { color: #c9b8a2; font-size: 12px; }

  footer {
    margin-top: 34px;
    text-align: center;
    font-size: 12.5px;
    color: #b7a894;
    letter-spacing: .5px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>三拼<span>组合</span> · 可重复</h1>
    <p class="sub">
      8 种食材 · 每三个一组（允许重复） · 共 <b id="total">0</b> 组<br>
      重复次数越多排得越靠前：三个相同 → 两个相同 → 三个不同 · 勾选状态自动保存
    </p>
  </header>

  <div class="toolbar">
    <span class="count">已选 <b id="selCount">0</b> 组</span>
    <button class="btn" id="selectAll" type="button">全选</button>
    <button class="btn" id="clearAll" type="button">清空</button>
  </div>

  <div class="grid" id="grid"></div>

  <footer>勾选结果保存在本机浏览器中，刷新或关闭页面后依然保留</footer>
</div>

<script>
(function () {
  "use strict";

  /* ---------- 数据 ---------- */
  var INGREDIENTS = ['五花肉', '豆腐', '莲藕', '笋', '香菇', '河虾', '糯米', '年糕'];
  var STORAGE_KEY = 'ingredient-triple-combos-with-repetition-v1';

  // 生成全部可重复组合：i <= j <= k，共 C(8+3-1,3) = 120 种
  var combos = [];
  for (var i = 0; i < INGREDIENTS.length; i++) {
    for (var j = i; j < INGREDIENTS.length; j++) {
      for (var k = j; k < INGREDIENTS.length; k++) {
        var maxFreq = 1;
        if (i === j && j === k) {
          maxFreq = 3;
        } else if (i === j || j === k) {
          maxFreq = 2;
        }
        combos.push({
          indices: [i, j, k],
          sig: i + '-' + j + '-' + k,
          maxFreq: maxFreq
        });
      }
    }
  }

  // 排序：重复次数降序；同重复次数按字典序升序
  combos.sort(function (a, b) {
    if (a.maxFreq !== b.maxFreq) return b.maxFreq - a.maxFreq;
    for (var n = 0; n < 3; n++) {
      if (a.indices[n] !== b.indices[n]) return a.indices[n] - b.indices[n];
    }
    return 0;
  });

  // 有效签名集合，用于过滤本地存储
  var validSigs = {};
  combos.forEach(function (c) { validSigs[c.sig] = true; });

  /* ---------- 本地存储读写 ---------- */
  var selected = {};   // { 组合签名: true }

  function loadFromStorage() {
    selected = {};
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return;
      arr.forEach(function (sig) {
        if (validSigs[sig]) selected[sig] = true;
      });
    } catch (e) {
      selected = {};
    }
  }

  function saveToStorage() {
    try {
      var arr = Object.keys(selected).filter(function (sig) {
        return validSigs[sig];
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
    } catch (e) {
      /* 隐私模式等场景下静默失败 */
    }
  }

  /* ---------- 渲染 ---------- */
  var grid = document.getElementById('grid');
  var selCountEl = document.getElementById('selCount');
  var totalEl = document.getElementById('total');
  var cards = [];   // { el, cb, sig }

  function pad3(n) {
    if (n < 10) return '00' + n;
    if (n < 100) return '0' + n;
    return String(n);
  }

  function buildUI() {
    var frag = document.createDocumentFragment();

    combos.forEach(function (combo, idx) {
      var card = document.createElement('label');
      card.className = 'card';
      card.dataset.sig = combo.sig;

      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.setAttribute(
        'aria-label',
        combo.indices.map(function (x) { return INGREDIENTS[x]; }).join('、')
      );

      var num = document.createElement('span');
      num.className = 'num';
      num.textContent = pad3(idx + 1);

      var names = document.createElement('span');
      names.className = 'names';
      names.innerHTML = combo.indices.map(function (x) {
        return '<span class="ing">' + INGREDIENTS[x] + '</span>';
      }).join('<span class="plus">+</span>');

      card.appendChild(cb);
      card.appendChild(num);
      card.appendChild(names);

      cb.addEventListener('change', function () {
        if (cb.checked) {
          selected[combo.sig] = true;
        } else {
          delete selected[combo.sig];
        }
        card.classList.toggle('on', cb.checked);
        saveToStorage();
        updateCount();
      });

      cards.push({ el: card, cb: cb, sig: combo.sig });
      frag.appendChild(card);
    });

    grid.appendChild(frag);
    totalEl.textContent = combos.length;
  }

  // 依据 selected 同步所有复选框界面
  function syncUI() {
    cards.forEach(function (item) {
      var on = !!selected[item.sig];
      item.cb.checked = on;
      item.el.classList.toggle('on', on);
    });
    updateCount();
  }

  function updateCount() {
    selCountEl.textContent = Object.keys(selected).length;
  }

  /* ---------- 工具栏操作 ---------- */
  document.getElementById('selectAll').addEventListener('click', function () {
    selected = {};
    combos.forEach(function (c) { selected[c.sig] = true; });
    saveToStorage();
    syncUI();
  });

  document.getElementById('clearAll').addEventListener('click', function () {
    selected = {};
    saveToStorage();
    syncUI();
  });

  /* ---------- 多标签页同步 ---------- */
  window.addEventListener('storage', function (e) {
    if (e.key !== STORAGE_KEY) return;
    loadFromStorage();
    syncUI();
  });

  /* ---------- 启动 ---------- */
  loadFromStorage();
  buildUI();
  syncUI();
})();
</script>
</body>
</html>
